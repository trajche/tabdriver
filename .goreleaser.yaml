version: 2
project_name: tabdriver

builds:
  - main: ./cmd/tabdriver
    binary: tabdriver
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/trajche/tabdriver/internal/common.Version={{ .Version }}

archives:
  # No version in the name, so /releases/latest/download/<name> always points at the newest build.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^Merge ", "^Release "]

release:
  extra_files:
    - glob: build/tabdriver-chrome.zip
  footer: |
    ## Install

    **macOS**: `brew tap trajche/tabdriver https://github.com/trajche/tabdriver && brew trust trajche/tabdriver && brew install tabdriver`
    **macOS / Linux**: `curl -fsSL https://raw.githubusercontent.com/trajche/tabdriver/main/install.sh | sh`
    **Windows**: `irm https://raw.githubusercontent.com/trajche/tabdriver/main/install.ps1 | iex`, or `scoop bucket add tabdriver https://github.com/trajche/tabdriver; scoop install tabdriver`

    **Firefox**: download `tabdriver-firefox.xpi` below and open it in Firefox. It updates itself.
    **Chrome, Arc, Brave, Edge**: unzip `tabdriver-chrome.zip`, then *Load unpacked* in `chrome://extensions` (Developer mode).

homebrew_casks:
  - name: tabdriver
    repository:
      owner: trajche
      name: tabdriver
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: tabdriver-release
      email: tabdriver-release@users.noreply.github.com
    commit_msg_template: "Release {{ .Tag }}: Homebrew cask"
    homepage: https://github.com/trajche/tabdriver
    description: Let AI agents drive your real browser, with your logins, while you watch
    license: MIT
    binaries: [tabdriver]
    # Homebrew 7 replaced postflight blocks with sandboxed install steps: HOME points into the
    # sandbox (tabdriver finds the real home itself) and steps may only write where listed.
    # Older Homebrew doesn't know install steps, so it gets the postflight blocks.
    custom_block: |
      if respond_to?(:postflight_steps)
        postflight_steps do
          run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "tabdriver"], chdir: ".", must_succeed: false,
                                print_stderr: false, writable_paths: ["tabdriver"], writable_base: :staged_path
          run "bin/tabdriver", base: :homebrew_prefix, args: ["install"],
                               writable_paths: ["Library/Application Support", ".tabdriver"], writable_base: :home
        end
        uninstall_preflight_steps do
          run "tabdriver", base: :staged_path, args: ["uninstall"], must_succeed: false,
                           writable_paths: ["Library/Application Support", ".tabdriver"], writable_base: :home
        end
      else
        postflight do
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tabdriver"] if OS.mac?
          system_command "#{HOMEBREW_PREFIX}/bin/tabdriver", args: ["install"]
        end
        uninstall_preflight do
          system_command "#{staged_path}/tabdriver", args: ["uninstall"], must_succeed: false
        end
      end
    caveats: |
      Registered with your browsers. Next: install the browser extension and add `tabdriver mcp`
      to your agent (run `tabdriver` for the exact lines). https://github.com/trajche/tabdriver

scoops:
  - name: tabdriver
    repository:
      owner: trajche
      name: tabdriver
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: bucket
    commit_author:
      name: tabdriver-release
      email: tabdriver-release@users.noreply.github.com
    commit_msg_template: "Release {{ .Tag }}: Scoop manifest"
    homepage: https://github.com/trajche/tabdriver
    description: Let AI agents drive your real browser, with your logins, while you watch
    license: MIT
    # $dir is the app's "current" folder, so the registered host path survives upgrades.
    post_install:
      - '& "$dir\tabdriver.exe" install'
